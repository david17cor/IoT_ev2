version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    ports:
      - "29092:29092"
    environment:
      # Configuraciones base de KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # KRaft exige un ID de clúster en base64 estático
      
      # Configuración de red y escuchas
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # Evita errores con tópicos en entornos de un solo nodo
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin_dataops
      POSTGRES_PASSWORD: password_seguro_123
      POSTGRES_DB: iot_predictivo
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_raw:
    image: postgres:15-alpine
    container_name: db_telemetria_cruda
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: telemetria_cruda_db
    ports:
      - "5433:5432" # Lo exponemos en el puerto 5433 para no chocar con el otro
    networks:
      - dataops_network

  spark-streaming:
    build:
      context: ./data_pipeline
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    environment:
      - SPARK_MODE=worker
      - DB_HOST=postgres
      - DB_PORT=5432
    # Usamos la red interna de Docker para conectarnos a Kafka y Postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend-api:
    build:
      context: ./backend_api
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    
  frontend-app:
    build:
      context: ./frontend_app
    depends_on:
      - backend-api
    ports:
      - "8501:8501"
    command: streamlit run app_frontend.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false

  productor-iot:
    build:
      context: ./productor-iot
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONBUFFERED=1
    restart: always

volumes:
  postgres_data: