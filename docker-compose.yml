version: '3.8'

services:
  # ==========================================
  # 1. CAPA DE INFRAESTRUCTURA (Arrancan primero)
  # ==========================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    restart: always
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataops_network

  postgres:
    image: postgres:15
    container_name: postgres_gold
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dataops_network

  minio:
    image: minio/minio:latest
    container_name: minio-datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-password123}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: 
      - dataops_network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dataops_network

  # ==========================================
  # 2. CAPA DE INGESTA Y PROCESAMIENTO
  # ==========================================

  productor-iot:
    container_name: productor_iot
    build:
      context: ./productor-iot
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dataops_network
    restart: always

  spark-streaming:
    container_name: spark_streaming
    build:
      context: ./data_pipeline
    env_file:
      - .env
    environment:
      - SPARK_MODE=worker
      - DB_HOST=postgres
      - DB_PORT=5432
      - MINIO_ENDPOINT=http://minio:9000
      - PYTHONBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dataops_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================
  # 3. CAPA DE CONSUMO Y FRONTEND
  # ==========================================

  backend-api:
    container_name: backend_api
    build:
      context: ./backend_api
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dataops_network
    
  frontend-app:
    container_name: frontend_app
    build:
      context: ./frontend_app
    depends_on:
      - backend-api
    ports:
      - "8501:8501"
    networks:
      - dataops_network
    command: streamlit run app_frontend.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false

# ==========================================
# VOLUMENES Y REDES
# ==========================================


# ==========================================
# MONITOREO
# ==========================================

# 1. cAdvisor: Lee las métricas de Docker (CPU/RAM)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - dataops_network

  # 2. Prometheus: Almacena las métricas históricas
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - dataops_network
    depends_on:
      - cadvisor

  # 3. Grafana: Panel visual para el equipo DataOps
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - dataops_network
    depends_on:
      - prometheus


volumes:
  postgres_data:
  pg_data_raw:

networks:
  dataops_network:
    driver: bridge